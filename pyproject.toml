[project]
name = "promoter-seeker"
version = "0.1.0"
description = "Hack the promoter hackaton"
requires-python = "==3.14.*"
dependencies = [
    "biopython",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promoter_seeker"]
