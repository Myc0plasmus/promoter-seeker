[project]
name = "promoter-seeker"
version = "0.1.0"
description = "Hack the promoter hackaton"
requires-python = "==3.14.*"
dependencies = [
    "biopython",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "fastapi[standard]>=0.141.1",
    "dotenv>=0.9.9",
    "jupyter",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promoter_seeker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the hyppe API (needs .env keys and network)",
    "upload: calls POST /wgraj (burns a 5-minute cooldown slot)",
]
