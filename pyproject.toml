[project]
name = "promoter-seeker"
version = "0.1.0"
description = "Hack the promoter hackaton"
requires-python = "==3.14.*"
dependencies = [
    "biopython",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "fastapi[standard]>=0.141.1",
    "dotenv>=0.9.9",
    "jupyterlab>=4.6.3",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-vim>=4.1.4",
    "python-lsp-server>=1.15.0",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promoter_seeker"]
